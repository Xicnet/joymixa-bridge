<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Joymixa Bridge</title>
  </head>
  <body>
    <div class="titlebar">
      <span class="title">Joymixa Bridge</span>
      <button id="close-btn">&times;</button>
    </div>

    <div class="content">
      <div class="status-section">
        <div class="status-row">
          <span class="label">Link</span>
          <!--
            "Enabled"/"Disabled" is the wording Ableton's Link UI guidelines mandate — not
            "Active"/"On". The value is written by the renderer from Link's own isEnabled();
            the markup starts Disabled so a bridge whose Link session never came up cannot
            render a green "Active" badge over a dead session.
          -->
          <span id="link-status" class="value badge badge-inactive">Disabled</span>
        </div>
        <div class="status-row">
          <span class="label">Link Peers</span>
          <span id="peer-count" class="value">0</span>
        </div>
        <div class="status-row">
          <span class="label">BPM</span>
          <span id="tempo" class="value">120.0</span>
        </div>
        <div class="status-row">
          <span class="label">Transport</span>
          <span id="transport" class="value">Stopped</span>
        </div>
        <div class="status-row">
          <span class="label">Browser Clients</span>
          <span id="client-count" class="value">0</span>
        </div>
      </div>

      <div class="divider"></div>

      <!--
        Phase bar. Ableton Link has no time-signature concept: it exposes a
        `quantum` (a phase-alignment unit measured in beats) and a `phase` in
        [0, quantum). The tick marks are therefore generated from the live
        quantum, never hardcoded to 4 — a fixed 4-LED row silently assumes 4/4
        and cannot represent a non-integer quantum at all.
      -->
      <div class="phase" id="phase">
        <div class="phase-bar">
          <div class="phase-fill" id="phase-fill"></div>
          <div class="phase-ticks" id="phase-ticks"></div>
        </div>
        <div class="phase-meta">
          <span class="phase-beat" id="phase-beat">1</span>
          <span class="phase-quantum" id="phase-quantum">/ 4 beats</span>
        </div>
      </div>

      <div class="divider"></div>

      <p id="ws-url" class="ws-url"></p>
    </div>
  </body>
</html>
