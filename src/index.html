<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Joymixa Bridge</title>
  </head>
  <body>
    <div class="titlebar">
      <span class="title">Joymixa Bridge</span>
      <button id="close-btn">&times;</button>
    </div>

    <div class="content">
      <div class="status-section">
        <div class="status-row">
          <span class="label">Link</span>
          <span id="link-status" class="value badge badge-active">Active</span>
        </div>
        <div class="status-row">
          <span class="label">Link Peers</span>
          <span id="peer-count" class="value">0</span>
        </div>
        <div class="status-row">
          <span class="label">BPM</span>
          <span id="tempo" class="value">120.0</span>
        </div>
        <div class="status-row">
          <span class="label">Transport</span>
          <span id="transport" class="value">Stopped</span>
        </div>
        <div class="status-row">
          <span class="label">Browser Clients</span>
          <span id="client-count" class="value">0</span>
        </div>
      </div>

      <div class="divider"></div>

      <div class="beat-leds">
        <div class="beat-led" id="beat-0"><span class="beat-num">1</span></div>
        <div class="beat-led" id="beat-1"><span class="beat-num">2</span></div>
        <div class="beat-led" id="beat-2"><span class="beat-num">3</span></div>
        <div class="beat-led" id="beat-3"><span class="beat-num">4</span></div>
      </div>

      <div class="divider"></div>

      <p id="ws-url" class="ws-url"></p>

      <div class="footer-actions">
        <button id="copy-logs-btn" class="copy-logs-btn">Copy Logs</button>
      </div>
    </div>
  </body>
</html>
