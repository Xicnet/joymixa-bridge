name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            targets: '@electron-forge/maker-deb,@electron-forge/maker-rpm,@electron-forge/maker-zip'
          - os: macos-latest
            targets: '@electron-forge/maker-dmg,@electron-forge/maker-zip'
          - os: macos-15-intel
            targets: '@electron-forge/maker-dmg,@electron-forge/maker-zip'
          # Pinned: windows-latest moved to Visual Studio 2026 (v18) in June 2026, which
          # node-gyp cannot detect yet (nodejs/node-gyp#3282) — the native Link addon
          # fails to configure. windows-2022 keeps the VS2022 toolchain, per GitHub's own
          # migration guidance (actions/runner-images#14017). Revisit when node-gyp ships
          # VS2026 support.
          - os: windows-2022
            targets: '@electron-forge/maker-squirrel,@electron-forge/maker-zip'

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y dpkg fakeroot rpm libavahi-compat-libdnssd-dev

      # Retry once on failure, clearing the yarn cache in between: a corrupt tarball
      # download (v1.9.0's Windows leg: "tar content ... appears to be corrupt" on a
      # transitive dep) persists in the runner's yarn cache, so a plain retry would
      # re-fail on the same bad entry. yarn v1 does not retry corrupt extractions.
      - name: Install dependencies
        shell: bash
        run: yarn install --frozen-lockfile || { yarn cache clean; yarn install --frozen-lockfile; }

      - name: Rebuild native addon for Electron
        run: yarn rebuild

      # Import the Developer ID certificate into a throwaway keychain. Skips cleanly
      # when the secrets are absent (forks, secret-less runs) — the build then
      # proceeds unsigned, same as before signing existed.
      - name: Prepare macOS signing keychain
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERT_P12" ]; then
            echo "No signing certificate configured — building unsigned."
            exit 0
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$MACOS_CERT_P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S 'apple-tool:,apple:' \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          rm "$RUNNER_TEMP/cert.p12"
          echo "MACOS_SIGNING=1" >> "$GITHUB_ENV"

      - name: Build distributables
        shell: bash
        env:
          # Consumed by forge.config.ts — signing/notarization activate only when
          # these are non-empty AND the keychain step above imported the cert.
          APPLE_ID: ${{ env.MACOS_SIGNING == '1' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ env.MACOS_SIGNING == '1' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ env.MACOS_SIGNING == '1' && secrets.APPLE_TEAM_ID || '' }}
        run: npx electron-forge make --targets "${{ matrix.targets }}"

      - name: Clean up signing keychain
        if: always() && runner.os == 'macOS' && env.MACOS_SIGNING == '1'
        shell: bash
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.os }}
          path: out/make/**/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
