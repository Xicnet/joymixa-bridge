name: Build iOS

on:
  # iOS build is paused (incomplete; not needed yet). Manual-only for now.
  # To re-enable automatic builds, uncomment the push trigger below.
  workflow_dispatch:
  # push:
  #   paths:
  #     - 'ios/**'

jobs:
  build:
    runs-on: macos-latest
    # Only bridge-only variant in CI.
    # Bundle variant requires proprietary game assets — build locally only.
    steps:
      - uses: actions/checkout@v6

      - name: Build
        working-directory: ios
        run: |
          xcodebuild -project LinkBridge.xcodeproj \
            -scheme LinkBridge \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/LinkBridge-bridgeOnly.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO

      - name: Export unsigned IPA
        working-directory: ios
        run: |
          mkdir -p build/Payload
          cp -r build/LinkBridge-bridgeOnly.xcarchive/Products/Applications/LinkBridge.app build/Payload/
          cd build && zip -r LinkBridge-bridgeOnly-unsigned.ipa Payload
          rm -rf Payload

      - uses: actions/upload-artifact@v7
        with:
          name: LinkBridge-bridgeOnly-unsigned.ipa
          path: ios/build/LinkBridge-bridgeOnly-unsigned.ipa
